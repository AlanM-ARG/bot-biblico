model_list:
  # --- Tier S (Razonamiento Muy Alto / RAG Profundo / Auditoría Doctrinal) ---
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: "os.environ/GEMINI_API_KEY"
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: "os.environ/GEMINI_API_KEY"

  # --- Tier A (Alto Razonamiento / Flujos Ágiles / Fidelidad Documental) ---
  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: "os.environ/GEMINI_API_KEY"
  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: "os.environ/GEMINI_API_KEY"

  # --- Tier B (Medio-Alto / Medio Razonamiento / Chats Estándar) ---
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: "os.environ/GEMINI_API_KEY"
  - model_name: gemini-flash-latest
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: "os.environ/GEMINI_API_KEY"

  # --- Tier C (Rápido / Básico / Metadatos ETL y Etiquetado Masivo) ---
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"
  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

  # --- Tier D (Muy Básico / Filtros Sintácticos y Cuota Ultrabaja) ---
  - model_name: gemini-flash-lite-latest
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: "os.environ/GEMINI_API_KEY"

  # --- Aliases Compatibles y Tiers Unificados (Comunes para los 3 Bots) ---
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: "os.environ/GEMINI_API_KEY"
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: "os.environ/GEMINI_API_KEY"
  - model_name: tier1-largo
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: "os.environ/GEMINI_API_KEY"
  - model_name: tier2-rapido
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: "os.environ/GEMINI_API_KEY"
  - model_name: tier3-corto
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

  # --- Proveedores Externos ---
  - model_name: groq-gpt-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: "os.environ/GROQ_API_KEY"
  - model_name: groq-qwen-27b
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: "os.environ/GROQ_API_KEY"
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "os.environ/OPENAI_API_KEY"
  # --- Fallback Local (Ollama) ---
  - model_name: ollama-local
    litellm_params:
      model: ollama/llama3.1
      api_base: "http://localhost:11434"

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  telemetry: true

environment_variables:
  LANGFUSE_SECRET_KEY: "os.environ/LANGFUSE_SECRET_KEY"
  LANGFUSE_PUBLIC_KEY: "os.environ/LANGFUSE_PUBLIC_KEY"
  LANGFUSE_HOST: "os.environ/LANGFUSE_BASE_URL"

router_settings:
  routing_strategy: "latency-based-routing"
  timeout: 45
  num_retries: 2
  fallbacks:
    - gemini-pro: ["gemini-3.5-flash", "gemini-3.1-pro-preview", "groq-gpt-120b", "groq-qwen-27b", "ollama-local"]
    - gemini-flash: ["gemini-3.5-flash", "groq-gpt-120b", "ollama-local"]
    - tier1-largo: ["gemini-3.5-flash", "gemini-3.1-pro-preview", "groq-gpt-120b", "ollama-local"]

general_settings:
  master_key: "sk-litellm-master-key"
  proxy_port: 4000
  proxy_host: "0.0.0.0"
